# ABOUTME: Alerting rules for vmalert. Catastrophic-only alerts for a homelab NAS.
# These are evaluated by vmalert against VictoriaMetrics.

groups:
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up{job!~"garage|garage-health|jellyfin-health|immich-health"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unreachable"
          description: "The {{ $labels.job }} service ({{ $labels.instance }}) is not responding to Prometheus scrapes. This alert fires after 1 hour of continuous failure."

      - alert: GarageHealthDown
        expr: probe_success{job="garage-health",service="garage"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "garage health endpoint is unreachable"
          description: "Garage health endpoint {{ $labels.instance }} is failing local HTTP probes. This alert fires after 1 hour of continuous failure."

      - alert: GarageHealthProbeBroken
        expr: up{job="garage-health"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "garage health probe is broken"
          description: "VictoriaMetrics cannot scrape the blackbox exporter probe for Garage. This is a monitoring failure, not proof that Garage itself is down."

      - alert: JellyfinHealthDown
        expr: probe_success{job="jellyfin-health",service="jellyfin"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "jellyfin health endpoint is unreachable"
          description: "Jellyfin health endpoint {{ $labels.instance }} is failing local HTTP probes. This alert fires after 1 hour of continuous failure."

      - alert: JellyfinHealthProbeBroken
        expr: up{job="jellyfin-health"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "jellyfin health probe is broken"
          description: "VictoriaMetrics cannot scrape the blackbox exporter probe for Jellyfin. This is a monitoring failure, not proof that Jellyfin itself is down."

      - alert: JellyfinPlaybackExporterBroken
        expr: absent(up{job="jellyfin-exporter"}) or up{job="jellyfin-exporter"} == 0 or jellyfin_exporter_up{job="jellyfin-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "jellyfin playback telemetry is unavailable"
          description: "The Jellyfin Sessions API exporter has been unreachable or unable to authenticate for 15 minutes. Jellyfin health is monitored separately."

      - alert: ImmichHealthDown
        expr: probe_success{job="immich-health",service="immich"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "immich health endpoint is unreachable"
          description: "Immich ping endpoint {{ $labels.instance }} is failing local HTTP probes. This alert fires after 1 hour of continuous failure."

      - alert: ImmichHealthProbeBroken
        expr: up{job="immich-health"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "immich health probe is broken"
          description: "VictoriaMetrics cannot scrape the blackbox exporter probe for Immich. This is a monitoring failure, not proof that Immich itself is down."

  - name: filesystem-health
    rules:
      - alert: ImmichBackupVarCapacityLow
        expr: nas_backup_filesystem_available_bytes{mount="/var"} < 107374182400 or (nas_backup_filesystem_available_bytes{mount="/var"} / nas_backup_filesystem_size_bytes{mount="/var"}) < 0.20
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Immich backup capacity is below its safety margin"
          description: "The root filesystem has less than 100 GiB or 20% free. Immich backup and library-import operations must stop until capacity is restored."

      - alert: RootFilesystemFull
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem is almost full"
          description: "Root filesystem has less than 10% space remaining ({{ $value | humanizePercentage }} free)."

      - alert: ZpoolFilesystemFull
        expr: (node_filesystem_avail_bytes{fstype="zfs"} / node_filesystem_size_bytes{fstype="zfs"}) < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ZFS filesystem {{ $labels.mountpoint }} is almost full"
          description: "ZFS dataset mounted at {{ $labels.mountpoint }} has less than 10% space remaining ({{ $value | humanizePercentage }} free)."

  - name: disk-health
    rules:
      - alert: DiskSmartUnhealthy
        expr: smartctl_device_smart_healthy == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SMART health check FAILED on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) has failed its SMART health assessment. Replace this drive."

      - alert: DiskPrefailAttribute
        expr: smartctl_device_reallocated_sector_ct > 0 or smartctl_device_current_pending_sector_ct > 0 or smartctl_device_offline_uncorrectable_ct > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.device }} has prefail SMART attributes"
          description: "Disk {{ $labels.device }} ({{ $labels.model }}, serial {{ $labels.serial }}) has reallocated, pending, or uncorrectable sectors. This drive may be failing."

      - alert: DiskHighTemperature
        expr: smartctl_device_temperature_celsius > 55
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.device }} temperature is {{ $value }}°C"
          description: "Disk {{ $labels.device }} ({{ $labels.model }}) has been above 55°C for 15 minutes. Check cooling."

      - alert: ZpoolDegraded
        expr: zpool_healthy == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is not healthy"
          description: "ZFS pool {{ $labels.pool }} is in a degraded, faulted, or otherwise unhealthy state. Check `zpool status` immediately."

  - name: backup-health
    rules:
      - alert: ImmichLocalBackupStale
        expr: absent(nas_backup_last_success_timestamp_seconds{application="immich",destination="local"}) or time() - nas_backup_last_success_timestamp_seconds{application="immich",destination="local"} > 129600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Immich local backup is missing or stale"
          description: "No successful local Immich backup has completed in the last 36 hours."

      - alert: ImmichB2BackupStale
        expr: absent(nas_backup_last_success_timestamp_seconds{application="immich",destination="b2"}) or time() - nas_backup_last_success_timestamp_seconds{application="immich",destination="b2"} > 129600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Immich B2 backup is missing or stale"
          description: "No successful B2 replication of the Immich repository has completed in the last 36 hours."

      - alert: ImmichBackupRunFailed
        expr: nas_backup_last_run_success{application="immich"} == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The latest Immich backup run failed"
          description: "The completed Immich backup workflow reported failure. The previous successful local and remote timestamps remain authoritative."

      - alert: ImmichBackupIntegrityStale
        expr: absent(nas_backup_integrity_last_success_timestamp_seconds{application="immich"}) or time() - nas_backup_integrity_last_success_timestamp_seconds{application="immich"} > 864000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Immich backup integrity verification is stale"
          description: "No successful structural integrity verification of the Immich backup repository has completed in the last 10 days."

      - alert: ImmichBackupIntegrityFailed
        expr: nas_backup_integrity_last_run_success{application="immich"} == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The latest Immich backup integrity check failed"
          description: "Do not replicate or prune the Immich restic repository until the integrity failure has been investigated."
