# ABOUTME: Declarative config for the rootless vmalert quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "vmalert"
application = "observability"
role = "alert-evaluator"
description = "VictoriaMetrics vmalert - Alerting Rules Evaluator"
documentation = "https://docs.victoriametrics.com/vmalert/"

[host]
username = "_nas_vmalert"
uid = 51220
subid-start = 512200000
display-name = "vmalert"

[container]
image = "docker.io/victoriametrics/vmalert:v1.151.0@sha256:e519f14c31f4d68015702e684a0fc3f1b4e559aa985d8f4462768f07f55b05c9"
log-driver = "journald"
network = "host"
exec = "-datasource.url=http://victoria-metrics.krun:8428 -remoteWrite.url=http://victoria-metrics.krun:8428 -remoteRead.url=http://victoria-metrics.krun:8428 -notifier.url=http://alertmanager.krun:9093 -rule=/etc/vmalert/alert-rules.yml -httpListenAddr=0.0.0.0:8880 -loggerFormat=json -loggerLevel=INFO"

[krun]
enabled = true
cpus = 1
ram-mib = 256
network = "tap"
ipv4 = "10.253.4.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 8880
host = "127.0.0.1:8880"
consumers = ["victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled alerting rules (read-only)"
source = "/usr/share/nas/vmalert"
target = "/etc/vmalert"
options = "ro"

[assets]
path = "/usr/share/nas/vmalert"

[unit]
timeout-start-sec = 330

[[startup.dependencies]]
service = "victoria-metrics"
endpoint = "http"
condition = "http"
path = "/-/healthy"
timeout-sec = 300
interval-sec = 2
