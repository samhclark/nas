# ABOUTME: Declarative config for the rootless Garage Quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "garage"
application = "garage"
role = "server"
description = "Garage S3-compatible Object Storage"
documentation = "https://garagehq.deuxfleurs.fr/"

[host]
username = "_nas_garage"
uid = 51110
subid-start = 511100000
display-name = "Garage"

[container]
image = "docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020"
log-driver = "journald"
network = "host"
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 1024
network = "tap"
ipv4 = "10.253.1.2/30"
probe-endpoint = "s3"

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/nas/garage/garage.toml"
target = "/etc/garage.toml"
options = "ro"

[[container.secrets]]
name = "garage-rpc-secret"

[[container.secrets]]
name = "garage-admin-token"

[[container.secrets]]
name = "garage-metrics-token"

[[container.endpoints]]
name = "s3"
port = 3900
host = "127.0.0.1:3900"
consumers = ["caddy"]

[[container.endpoints]]
name = "rpc"
port = 3902
host = "127.0.0.1:3902"

[[container.endpoints]]
name = "admin"
port = 3903
host = "127.0.0.1:3903"
consumers = ["caddy", "victoria-metrics", "blackbox-exporter"]

[assets]
path = "/usr/share/nas/garage"

[[storage]]
name = "meta"
kind = "managed-zfs"
dataset = "tank/garage/meta"
host-path = "/var/lib/garage/meta"
mode = "0750"
record-size = "4K"
compression = "lz4"
atime = false
primary-cache = "metadata"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/garage/meta"
access = "read-write"

[[storage]]
name = "data"
kind = "managed-zfs"
dataset = "tank/garage/data"
host-path = "/var/lib/garage/data"
mode = "0750"
record-size = "1M"
compression = "off"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/garage/data"
access = "read-write"

[unit]
timeout-start-sec = 4200

[startup]
require-published-tcp-ports-free = true
