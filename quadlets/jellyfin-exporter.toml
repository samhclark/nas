# ABOUTME: Declarative config for the rootless Jellyfin Sessions API exporter;
# its read-only API key is distributed by the root-owned SOPS service.

[service]
name = "jellyfin-exporter"
application = "jellyfin"
role = "exporter"
description = "Jellyfin Playback Metrics Exporter"
documentation = "https://jellyfin.org/docs/general/networking/monitoring/"

[host]
username = "_nas_jellyfinmetrics"
uid = 51260
subid-start = 512600000
display-name = "Jellyfin exporter"

[container]
image = "docker.io/library/python:3.14.7-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6"
log-driver = "journald"
network = "host"
container-user = 0
exec = "python3 /app/jellyfin_exporter.py"

[container.environment]
JELLYFIN_URL = "http://jellyfin.krun:8096"
JELLYFIN_API_KEY_FILE = "/run/secrets/jellyfin-api-key"
LISTEN_HOST = "0.0.0.0"
LISTEN_PORT = "9594"

[krun]
enabled = true
cpus = 1
ram-mib = 128
network = "tap"
ipv4 = "10.253.8.2/30"
probe-endpoint = "metrics"

[[container.endpoints]]
name = "metrics"
port = 9594
host = "127.0.0.1:9594"
consumers = ["victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled dependency-free exporter (read-only)"
source = "/usr/share/nas/jellyfin-exporter"
target = "/app"
options = "ro"

[[container.secrets]]
name = "jellyfin-api-key"

[assets]
path = "/usr/share/nas/jellyfin-exporter"

[startup]
require-published-tcp-ports-free = true
