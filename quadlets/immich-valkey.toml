# ABOUTME: Persistent Valkey queue/cache service for Immich.

[service]
name = "immich-valkey"
application = "immich"
role = "cache"
description = "Immich Valkey Queue and Cache"
documentation = "https://valkey.io/"

[host]
username = "_nas_immichvalkey"
uid = 51150
subid-start = 511500000
display-name = "Immich Valkey"

[container]
image = "docker.io/valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d"
log-driver = "journald"
entrypoint = "/usr/share/nas/immich-valkey/immich-valkey-entrypoint.sh"
exec = "--port 6379"
network = "host"
container-user = 1000
no-new-privileges = true
drop-capabilities = ["NET_RAW"]

[[container.volumes]]
comment = "Image-controlled Valkey entrypoint adapter (read-only)"
source = "/usr/share/nas/immich-valkey"
target = "/usr/share/nas/immich-valkey"
options = "ro"

[assets]
path = "/usr/share/nas/immich-valkey"

[krun]
enabled = true
cpus = 1
ram-mib = 512
network = "tap"
ipv4 = "10.253.12.2/30"
probe-endpoint = "redis"

[[container.endpoints]]
name = "redis"
port = 6379
consumers = ["immich-server"]

[[storage]]
name = "data"
kind = "directory"
host-path = "/var/lib/immich/valkey"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/data"
access = "read-write"
