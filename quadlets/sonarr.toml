# ABOUTME: Sonarr TV-library automation with Mullvad-only internet egress and
# shared TRaSH-layout media access.

[service]
name = "sonarr"
application = "media-automation"
role = "tv"
description = "Sonarr TV Library Automation"
documentation = "https://sonarr.tv/"

[host]
username = "_nas_sonarr"
uid = 51410
subid-start = 514100000
display-name = "Sonarr"

[identity]
supplemental-groups = ["media"]
mapped-container-id = 1000
mapped-group = "media"

[container]
image = "lscr.io/linuxserver/sonarr:4.0.19.2979-ls321@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0"
log-driver = "journald"
network = "host"
container-user = 1000
entrypoint = "/usr/share/nas/sonarr/sonarr-entrypoint.sh"
health-cmd = "none"
no-new-privileges = true
drop-capabilities = ["NET_RAW"]
dns = ["100.100.100.100"]

[container.environment]
TZ = "America/Chicago"
TMPDIR = "/tmp"
# Servarr's CLEF console layout is JSONL; the application file logs remain
# enabled for its web UI and detailed diagnostics.
SONARR__LOG__CONSOLEFORMAT = "Clef"

[[container.volumes]]
comment = "Image-controlled libkrun entrypoint adapter (read-only)"
source = "/usr/share/nas/sonarr"
target = "/usr/share/nas/sonarr"
options = "ro"

[krun]
enabled = true
cpus = 2
ram-mib = 1024
network = "tap"
ipv4 = "10.253.14.2/30"
probe-endpoint = "http"
probe-timeout-sec = 300
egress = "mullvad"

[[container.endpoints]]
name = "http"
port = 8989
consumers = ["caddy", "prowlarr"]

[assets]
path = "/usr/share/nas/sonarr"

[[storage]]
name = "config"
kind = "managed-zfs"
dataset = "tank/sonarr/config"
host-path = "/var/lib/sonarr/config"
mode = "0750"
record-size = "16K"
compression = "lz4"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/config"
access = "read-write"

[[shared-storage]]
resource = "media"
subpath = "data"
container-path = "/data"
access = "read-write"

[unit]
timeout-start-sec = 900
