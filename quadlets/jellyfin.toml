# ABOUTME: Declarative config for Jellyfin's rootless runtime, owned datasets,
# and the shared media resource's read-only export.

[service]
name = "jellyfin"
application = "jellyfin"
role = "server"
description = "Jellyfin Media Server"
documentation = "https://jellyfin.org/docs/"

[host]
username = "_nas_jellyfin"
uid = 51120
subid-start = 511200000
display-name = "Jellyfin"

[identity]
supplemental-groups = ["media"]

[container]
image = "docker.io/jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db"
log-driver = "journald"
network = "host"
container-user = 0
# Keep the pinned image's default logging configuration: it writes the
# application stream to stdout and rolling application logs under /config/log.
# The config export therefore preserves Jellyfin and ffmpeg/transcode files.
# The image healthcheck uses podman exec, which the krun handler does not
# support. External blackbox monitoring remains the health source of truth.
health-cmd = "none"

[container.environment]
JELLYFIN_PublishedServerUrl = "https://jellyfin.i.samhclark.com"

[krun]
enabled = true
cpus = 4
ram-mib = 4096
network = "tap"
ipv4 = "10.253.2.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 8096
host = "127.0.0.1:8096"
consumers = ["caddy", "blackbox-exporter", "jellyfin-exporter", "radarr", "sonarr"]

[[storage]]
name = "config"
kind = "managed-zfs"
dataset = "tank/jellyfin/config"
host-path = "/var/lib/jellyfin/config"
mode = "0750"
record-size = "16K"
compression = "lz4"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/config"
access = "read-write"

[[storage]]
name = "cache"
kind = "managed-zfs"
dataset = "tank/jellyfin/cache"
host-path = "/var/lib/jellyfin/cache"
mode = "0750"
record-size = "128K"
compression = "lz4"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/cache"
access = "read-write"

# The generated image expects the reviewed operator migration to create this
# layout before Jellyfin starts.
[[shared-storage]]
resource = "media"
subpath = "data/media"
container-path = "/data/media"
access = "read-only"

[unit]
timeout-start-sec = 3900

[startup]
require-published-tcp-ports-free = true
