# ABOUTME: Declarative config for the rootless blackbox exporter quadlet;
# consumed by generate-quadlets.py (build time) and sops-distribute-secrets.sh
# (boot time).

[service]
name = "blackbox-exporter"
application = "observability"
role = "blackbox-exporter"
description = "Prometheus Blackbox Exporter"
documentation = "https://github.com/prometheus/blackbox_exporter"

[host]
username = "_nas_blackbox"
uid = 51230
subid-start = 512300000
display-name = "blackbox exporter"

[container]
image = "quay.io/prometheus/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea"
log-driver = "journald"
network = "host"
exec = "--config.file=/config/blackbox.yml --web.listen-address=0.0.0.0:9115 --log.format=json"

[krun]
enabled = true
cpus = 1
ram-mib = 128
network = "tap"
ipv4 = "10.253.5.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 9115
host = "127.0.0.1:9115"
consumers = ["victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled local probe configuration (read-only)"
source = "/usr/share/nas/blackbox-exporter"
target = "/config"
options = "ro"

[assets]
path = "/usr/share/nas/blackbox-exporter"
