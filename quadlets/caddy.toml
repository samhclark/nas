# ABOUTME: Declarative config for the rootless Caddy Quadlet, including its
# persistent state lifecycle and container exports.

[service]
name = "caddy"
application = "caddy"
role = "proxy"
description = "Caddy Reverse Proxy"
documentation = "https://caddyserver.com/docs/"

[host]
username = "_nas_caddy"
uid = 51310
subid-start = 513100000
display-name = "Caddy"

[container]
image = "ghcr.io/samhclark/lab-caddy:2.11.4-cf-0.2.4@sha256:f679deeac2fe831750d0027c9d7b73780fbca2cd66623b6538eeac42370b8e55"
log-driver = "journald"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the nested guest.
# MagicDNS preserves tailnet resolution and forwards public lookups to the
# tailnet-wide Quad9 resolver over Tailscale's encrypted DNS path.
dns = ["100.100.100.100"]
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 512
network = "tap"
ipv4 = "10.253.9.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 80
host = "0.0.0.0:80"

[[container.endpoints]]
name = "https"
port = 443
host = "0.0.0.0:443"

[[container.endpoints]]
name = "https-udp"
port = 443
host = "0.0.0.0:443"
protocol = "udp"

[[container.endpoints]]
name = "admin"
port = 2019
host = "127.0.0.1:2019"
consumers = ["victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/nas/caddy/Caddyfile"
target = "/etc/caddy/Caddyfile"
options = "ro"

[[container.secrets]]
name = "cf-api-token"

[assets]
path = "/usr/share/nas/caddy"

[[storage]]
name = "data"
kind = "directory"
host-path = "/var/lib/caddy"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/data"
access = "read-write"

[[storage]]
name = "config"
kind = "directory"
host-path = "/var/lib/caddy-config"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/config"
access = "read-write"

[unit]
timeout-start-sec = 330
