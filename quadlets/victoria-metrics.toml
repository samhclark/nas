# ABOUTME: Declarative config for the rootless VictoriaMetrics Quadlet;
# consumed by generate-quadlets.py (build time) and
# sops-distribute-secrets.sh (boot time).

[service]
name = "victoria-metrics"
application = "observability"
role = "metrics"
description = "VictoriaMetrics Time Series Database"
documentation = "https://docs.victoriametrics.com/"

[host]
username = "_nas_victoriametrics"
uid = 51250
subid-start = 512500000
display-name = "VictoriaMetrics"

[container]
image = "docker.io/victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8"
log-driver = "journald"
network = "host"
container-user = 0
exec = "-storageDataPath=/victoria-metrics-data -retentionPeriod=1 -promscrape.config=/etc/victoria-metrics/promscrape.yml -httpListenAddr=0.0.0.0:8428"

[krun]
enabled = true
cpus = 2
ram-mib = 1024
network = "tap"
ipv4 = "10.253.7.2/30"
probe-endpoint = "http"
host-access = [9100]

[[container.endpoints]]
name = "http"
port = 8428
host = "127.0.0.1:8428"
consumers = ["caddy", "grafana", "vmalert"]

[[container.volumes]]
comment = "Image-controlled scrape configuration (read-only)"
source = "/usr/share/nas/victoria-metrics/promscrape.yml"
target = "/etc/victoria-metrics/promscrape.yml"
options = "ro"

[[container.secrets]]
name = "garage-metrics-token"

[assets]
path = "/usr/share/nas/victoria-metrics"

[[storage]]
name = "data"
kind = "managed-zfs"
dataset = "tank/victoria-metrics/data"
host-path = "/var/lib/victoria-metrics"
mode = "0750"
record-size = "128K"
compression = "lz4"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/victoria-metrics-data"
access = "read-write"

[unit]
timeout-start-sec = 900
