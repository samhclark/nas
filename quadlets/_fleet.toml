# Authored fleet-level identity declarations.
#
# Service files opt into these groups through their [identity] table. Keep
# this file separate from service TOML files: the compiler discovers services
# with the [!_]*.toml glob.

[[groups]]
name = "media"
gid = 52000

[[host-secret-consumers]]
name = "immich-backup"
secrets = [
  "immich-backup-restic-password",
  "immich-backup-b2-key-id",
  "immich-backup-b2-application-key",
  "immich-backup-b2-bucket",
  "immich-backup-b2-s3-endpoint",
]

[[host-vm-taps]]
name = "immich-backup"
interface = "krun-backup"
ipv4 = "10.253.19.2/30"
managed-units = [
  "nas-backup-immich.service",
  "nas-maintain-immich-backup.service",
]

[egress.mullvad]
interface = "wg-arr"
address = "10.72.38.9/32"
peer-public-key = "xpZ3ZDEukbqKQvdHwaqKMUhsYhcYD3uLPUh1ACsVr1s="
endpoint = "23.144.160.86:3094"
allowed-ips = ["0.0.0.0/0"]
secret = "mullvad-private-key"
route-table = 51820
firewall-mark = 51820

[[resources]]
name = "media"
kind = "existing-zfs"
dataset = "tank/videos"
host-path = "/var/zfs/tank/videos"
shared-group = "media"
mode = "2775"
required-paths = [
  "data",
  "data/usenet",
  "data/usenet/incomplete",
  "data/usenet/complete",
  "data/usenet/complete/movies",
  "data/usenet/complete/tv",
  "data/media",
  "data/media/movies",
  "data/media/tv",
]
