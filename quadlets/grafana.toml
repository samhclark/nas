# ABOUTME: Declarative config for the rootless Grafana quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "grafana"
application = "observability"
role = "grafana"
description = "Grafana Dashboard"
documentation = "https://grafana.com/docs/grafana/latest/"

[host]
username = "_nas_grafana"
uid = 51210
subid-start = 512100000
display-name = "Grafana"

[container]
image = "docker.io/grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b"
log-driver = "journald"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the krun guest.
# Plugin installation can require external name resolution during startup.
dns = ["100.100.100.100"]
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 2048
network = "tap"
ipv4 = "10.253.3.2/30"
probe-endpoint = "http"

[container.environment]
# GF_PLUGINS_PREINSTALL_SYNC installs both datasource plugins before Grafana
# starts. Pin the VictoriaLogs plugin so provisioning remains reproducible.
GF_PLUGINS_PREINSTALL_SYNC = "victoriametrics-metrics-datasource,victoriametrics-logs-datasource@0.31.0"
GF_SERVER_HTTP_ADDR = "0.0.0.0"
GF_SERVER_HTTP_PORT = "3000"
GF_AUTH_ANONYMOUS_ENABLED = "true"
GF_AUTH_ANONYMOUS_ORG_ROLE = "Admin"
GF_AUTH_DISABLE_LOGIN_FORM = "false"
# Keep the container's stdout as the sole Grafana log sink and preserve a
# structured JSON message without maintaining a duplicate file-log copy.
GF_LOG_MODE = "console"
GF_LOG_CONSOLE_FORMAT = "json"

[[container.endpoints]]
name = "http"
port = 3000
host = "127.0.0.1:3000"
consumers = ["caddy", "victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled provisioning configs (read-only)"
source = "/usr/share/nas/grafana/provisioning"
target = "/etc/grafana/provisioning"
options = "ro"

[[container.volumes]]
comment = "Image-controlled dashboards (read-only)"
source = "/usr/share/nas/grafana/dashboards"
target = "/etc/grafana/dashboards"
options = "ro"

[assets]
path = "/usr/share/nas/grafana"

[[storage]]
name = "state"
kind = "directory"
host-path = "/var/lib/grafana"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/grafana"
access = "read-write"

[unit]
timeout-start-sec = 900
