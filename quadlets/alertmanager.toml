# ABOUTME: Declarative config for the rootless Alertmanager quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "alertmanager"
application = "observability"
role = "alertmanager"
description = "Prometheus Alertmanager"
documentation = "https://prometheus.io/docs/alerting/latest/alertmanager/"

[host]
username = "_nas_alertmanager"
uid = 51240
subid-start = 512400000
display-name = "Alertmanager"

[container]
image = "docker.io/prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d"
log-driver = "journald"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the krun guest.
# MagicDNS forwards public lookups to the tailnet-wide Quad9 resolver.
dns = ["100.100.100.100"]
container-user = 0
exec = "--web.listen-address=0.0.0.0:9093 --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --cluster.listen-address= --log.format=json --log.level=info"

[krun]
enabled = true
cpus = 1
ram-mib = 256
network = "tap"
ipv4 = "10.253.6.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 9093
host = "127.0.0.1:9093"
consumers = ["vmalert", "victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/nas/alertmanager/alertmanager.yml"
target = "/etc/alertmanager/alertmanager.yml"
options = "ro"

[[container.secrets]]
name = "pushover-user-key"

[[container.secrets]]
name = "pushover-api-token"

[assets]
path = "/usr/share/nas/alertmanager"

[[storage]]
name = "state"
kind = "directory"
host-path = "/var/lib/alertmanager"
mode = "0750"
subdirectories = ["data"]

[[storage.exports]]
subpath = "data"
container-path = "/alertmanager"
access = "read-write"
