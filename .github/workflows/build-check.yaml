# ABOUTME: CI workflow to validate container builds on PRs and pushes to main
# Does not push to registry or sign - just validates the build succeeds

name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}/bootc

jobs:
  preflight:
    uses: ./.github/workflows/build-preflight.yaml
    permissions:
      contents: read
      packages: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          pull: true
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-check
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ZFS_VERSION=${{ needs.preflight.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.preflight.outputs.kernel-version }}

      - name: Verify exact built image contract
        run: make verify-image IMAGE_NAME="${IMAGE_NAME}" TAG=ci-check
