name: Generate and Deploy Ignition Files

on:
  push:
    branches: [ main ]
    paths: 
      - 'butane.yaml'
      - 'Makefile'
      - 'pages/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-ignition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Generate and stage Pages artifact
        run: |
          make generate-ignition
          jq --exit-status . ignition.json >/dev/null
          install -d -m 0755 _site
          install -m 0644 ignition.json pages/index.html _site/
          mapfile -t site_files < <(
            find _site -maxdepth 1 -type f -printf '%f\n' | sort
          )
          [[ "${site_files[*]}" == "ignition.json index.html" ]]
          
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-ignition
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
