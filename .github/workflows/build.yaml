name: Build NAS

on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * *'  # Daily at 9:18 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bootc

concurrency:
  group: nas-publisher
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/build-preflight.yaml
    permissions:
      contents: read
      packages: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          pull: true
          push: true
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ZFS_VERSION=${{ needs.preflight.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.preflight.outputs.kernel-version }}

      - name: Verify exact built image contract
        run: make verify-image IMAGE_NAME="${REGISTRY}/${IMAGE_NAME}" TAG=stable

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the published OCI image
        uses: samhclark/cosign-exec-action@fd4c037a25705e60a8ba5cf337e48e2088479dd8 # v1.1.1
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            sign --yes --key=env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false 
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
